<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HQ</title>
<style>
:root{--bg:#14202f;--card:#1f2f44;--ink:#fff;--ink2:#c9d4e2;--mute:#8fa0b5;--grid:#2c3e57;
  --Pulse:#4f8ff7;--Veridian:#27a865;--Frontline:#e5601a}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 40px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.top h1{flex:1;margin:0;font-size:26px;letter-spacing:.2px}
.top small{color:var(--mute);font-weight:500;font-size:14px;margin-left:8px}
button{font:inherit;color:inherit;background:var(--card);border:0;border-radius:12px;padding:10px 16px;cursor:pointer}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}
.tile{background:var(--card);border-radius:18px;padding:16px 18px}
.tile .lab{color:var(--mute);font-size:14px;text-transform:uppercase;letter-spacing:.6px}
.tile .big{font-size:34px;font-weight:700;margin:4px 0 8px;font-variant-numeric:tabular-nums}
.split{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--ink2);font-size:14px;font-variant-numeric:tabular-nums}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:0}
.card{background:var(--card);border-radius:18px;padding:16px 14px 10px;position:relative}
.legend{display:flex;gap:18px;flex-wrap:wrap;color:var(--ink2);font-size:14px;margin:0 4px 6px}
svg{display:block;width:100%;height:auto;overflow:visible}
.tip{position:absolute;pointer-events:none;background:#0b1320;border:1px solid var(--grid);border-radius:10px;padding:10px 12px;font-size:14px;min-width:170px;display:none;z-index:5}
.tip b{display:block;margin-bottom:4px}.tip div{display:flex;justify-content:space-between;gap:12px;font-variant-numeric:tabular-nums}
.tip .t{border-top:1px solid var(--grid);margin-top:4px;padding-top:4px;font-weight:700}
details{margin-top:14px;color:var(--ink2)}summary{cursor:pointer;color:var(--mute);font-size:14px}
table{width:100%;border-collapse:collapse;margin-top:8px;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:6px 8px;text-align:right;border-bottom:1px solid var(--grid)}th:first-child,td:first-child{text-align:left}
th{color:var(--mute);font-weight:600}tr.now td{font-weight:700}
.note{color:var(--mute);font-size:13px;margin-top:10px}
#chart{overflow-x:auto;-webkit-overflow-scrolling:touch}
@media (max-width:640px){.tiles{grid-template-columns:1fr;gap:8px}.tile{padding:12px 16px}.tile .big{font-size:28px;margin:2px 0 4px}#chart svg{min-width:760px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><h1>HQ<small id="built"></small></h1><button id="refresh">Refresh</button></div>
  <div class="tiles" id="tiles"></div>
  <div class="card">
    <div class="legend" id="legend"></div>
    <div id="chart"></div>
    <div class="tip" id="tip"></div>
  </div>
  <details><summary>Show the numbers</summary><div id="table"></div></details>
  <div class="note" id="note"></div>
</div>
<script>
let D = /*__DATA__*/null;
const CO = ['Pulse', 'Veridian', 'Frontline'];  // stack order, bottom to top
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const $ = s => document.querySelector(s);
const tot = m => CO.reduce((a, c) => a + m[c], 0);
const fmt = n => '$' + Math.round(n).toLocaleString('en-AU');
const k = n => n >= 1000 ? '$' + (Math.round(n / 100) / 10).toLocaleString('en-AU') + 'k' : '$' + Math.round(n);
const lab = ym => MON[+ym.slice(5) - 1] + (ym.slice(5) === '01' ? ' ' + ym.slice(2, 4) : '');

function draw() {
  if (!D) { $('#tiles').innerHTML = '<div class="tile">Open this page through the HQ web app to see the numbers.</div>'; return; }
  const ms = D.months, i0 = ms.findIndex(m => m.ym === D.thisYm);
  const sum = list => { const o = { t: 0 }; CO.forEach(c => { o[c] = list.reduce((a, m) => a + m[c], 0); o.t += o[c]; }); return o; };
  const tiles = [
    ['This month · ' + MON[+D.thisYm.slice(5) - 1], sum(ms.slice(i0, i0 + 1))],
    ['Next 3 months', sum(ms.slice(i0, i0 + 3))],
    ['Next 12 months', sum(ms.slice(i0, i0 + 12))],
  ];
  $('#tiles').innerHTML = tiles.map(([l, s]) => '<div class="tile"><div class="lab">' + l + '</div><div class="big">' + fmt(s.t) + '</div><div class="split">' +
    CO.slice().reverse().map(c => '<span><span class="sw" style="background:var(--' + c + ')"></span>' + c + ' ' + k(s[c]) + '</span>').join('') + '</div></div>').join('');
  $('#legend').innerHTML = CO.slice().reverse().map(c => '<span><span class="sw" style="background:var(--' + c + ')"></span>' + c + '</span>').join('');
  $('#built').textContent = 'live from the register · ' + new Date(D.built).toLocaleString('en-AU', { weekday: 'short', hour: 'numeric', minute: '2-digit' });

  // chart
  const W = 1000, H = 380, L = 54, R = 8, T = 22, B = 34;
  const max = Math.max(1, ...ms.map(tot));
  const step = max > 80000 ? 20000 : max > 40000 ? 10000 : 5000;
  const top = Math.ceil(max / step) * step;
  const y = v => T + (H - T - B) * (1 - v / top);
  const bw = (W - L - R) / ms.length, gap = Math.max(6, bw * 0.28);
  let s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Revenue by company per month">';
  for (let v = 0; v <= top; v += step) s += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(v) + '" y2="' + y(v) + '" stroke="var(--grid)" stroke-width="1"/>' +
    '<text x="' + (L - 8) + '" y="' + (y(v) + 4) + '" fill="var(--mute)" font-size="13" text-anchor="end">' + (v ? '$' + v / 1000 + 'k' : '$0') + '</text>';
  ms.forEach((m, i) => {
    const x = L + i * bw + gap / 2, w = bw - gap, past = i < i0, now = i === i0;
    let base = 0;
    const segs = CO.filter(c => m[c] > 0);
    segs.forEach((c, j) => {
      const y1 = y(base + m[c]), y0 = y(base), last = j === segs.length - 1;
      const h = Math.max(0, y0 - y1 - (j ? 2 : 0));   // 2px gap between stacked segments
      const r = last ? Math.min(4, h) : 0;
      s += '<path d="M' + x + ',' + (y1 + h) + 'V' + (y1 + r) + (r ? 'q0,-' + r + ' ' + r + ',-' + r + 'H' + (x + w - r) + 'q' + r + ',0 ' + r + ',' + r : 'H' + (x + w)) + 'V' + (y1 + h) + 'Z" fill="var(--' + c + ')"' + (past ? ' opacity=".45"' : '') + '/>';
      base += m[c];
    });
    const t = tot(m);
    if (t) s += '<text x="' + (x + w / 2) + '" y="' + (y(t) - 6) + '" fill="' + (past ? 'var(--mute)' : 'var(--ink2)') + '" font-size="12.5" text-anchor="middle"' + (now ? ' font-weight="700" fill="var(--ink)"' : '') + '>' + k(t) + '</text>';
    s += '<text x="' + (x + w / 2) + '" y="' + (H - 12) + '" fill="' + (now ? 'var(--ink)' : 'var(--mute)') + '" font-size="13" text-anchor="middle"' + (now ? ' font-weight="700"' : '') + '>' + lab(m.ym) + '</text>';
    if (now) s += '<line x1="' + (x - gap / 2 + 2) + '" x2="' + (x + w + gap / 2 - 2) + '" y1="' + (H - 6) + '" y2="' + (H - 6) + '" stroke="var(--ink)" stroke-width="2" stroke-linecap="round"/>';
    s += '<rect class="hit" data-i="' + i + '" x="' + (L + i * bw) + '" y="' + T + '" width="' + bw + '" height="' + (H - T - B + 20) + '" fill="transparent"/>';
  });
  s += '</svg>';
  $('#chart').innerHTML = s;
  const ch = $('#chart'); if (ch.scrollWidth > ch.clientWidth) ch.scrollLeft = (ch.scrollWidth / ms.length) * Math.max(0, i0 - 1);

  const tip = $('#tip'), card = $('.card');
  const show = (e, i) => {
    const m = ms[i];
    tip.innerHTML = '<b>' + MON[+m.ym.slice(5) - 1] + ' ' + m.ym.slice(0, 4) + '</b>' +
      CO.slice().reverse().map(c => '<div><span><span class="sw" style="background:var(--' + c + ')"></span>' + c + '</span><span>' + fmt(m[c]) + '</span></div>').join('') +
      '<div class="t"><span>Total</span><span>' + fmt(tot(m)) + '</span></div>';
    tip.style.display = 'block';
    const r = card.getBoundingClientRect(), px = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
    tip.style.left = Math.min(Math.max(8, px - tip.offsetWidth / 2), r.width - tip.offsetWidth - 8) + 'px';
    tip.style.top = '44px';
  };
  card.querySelectorAll('.hit').forEach(h => {
    h.addEventListener('mousemove', e => show(e, +h.dataset.i));
    h.addEventListener('click', e => show(e, +h.dataset.i));
    h.addEventListener('mouseleave', () => { tip.style.display = 'none'; });
  });

  $('#table').innerHTML = '<table><tr><th>Month</th>' + CO.slice().reverse().map(c => '<th>' + c + '</th>').join('') + '<th>Total</th></tr>' +
    ms.map((m, i) => '<tr' + (i === i0 ? ' class="now"' : '') + '><td>' + MON[+m.ym.slice(5) - 1] + ' ' + m.ym.slice(0, 4) + '</td>' +
      CO.slice().reverse().map(c => '<td>' + fmt(m[c]) + '</td>').join('') + '<td>' + fmt(tot(m)) + '</td></tr>').join('') + '</table>';
  $('#note').textContent = 'Revenue by the Month column on the WO tab (when the work is done). Lost jobs left out.' +
    (D.pulseFlat ? ' Pulse shown as a flat ' + fmt(D.pulseFlat) + ' a month.' : ' Pulse from the sensor subscription rows.');
}

$('#refresh').onclick = () => {
  const b = $('#refresh');
  if (window.google && google.script && google.script.run) {
    b.textContent = 'Loading…';
    google.script.run.withSuccessHandler(d => { D = d; draw(); b.textContent = 'Refresh'; })
      .withFailureHandler(e => { b.textContent = 'Refresh'; alert(e.message || e); }).getData();
  } else location.reload();
};
draw();
</script>
</body>
</html>
