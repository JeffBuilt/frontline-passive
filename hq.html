<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Veridian + Frontline + Pulse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #21334a; --ink2: #182739; --fire: #e8572a; --fire-dk: #c2410c; --vp: #21334a; --vp-lt: #e1e6ec; --pu: #7b93ad; --pu-lt: #e9eef3;
    --paid: #21334a; --inv: #4b6a8c; --done: #8fa6bf; --appr: #c5d2de; --pipe: #e3e8ed;
    --bg: #eef1f4; --card: #fff; --line: #dde2e7; --muted: #66727e; --text: #1b2733; --hivis: #ffd23f; --red: #c62828;
    --body: 'Barlow', system-ui, sans-serif; --display: 'Barlow Condensed', 'Barlow', system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.45 var(--body); -webkit-text-size-adjust: 100%; }
  button { font: inherit; color: inherit; cursor: pointer; }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 0 18px 60px; }

  .top { background: var(--ink); color: #fff; }
  .top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-top: 16px; padding-bottom: 16px; }
  .marks { display: flex; align-items: center; gap: 16px; }
  .vpmark { font: 700 24px/1 var(--display); letter-spacing: .14em; color: #fff; }
  .vpmark small { display: block; font: 600 11px var(--body); letter-spacing: .32em; color: #9fb3c5; margin-top: 4px; }
  .marks .plus { color: #6f859b; font: 600 22px var(--display); }

  .marks img { height: 38px; width: auto; display: block; }
  .top-r { display: flex; align-items: center; gap: 10px; color: #c9d3dd; font-size: 14px; }
  .btn-ghost { background: transparent; border: 1px solid #4a5f7a; color: #fff; border-radius: 999px; padding: 7px 14px; font-weight: 600; }

  .filters { position: sticky; top: 0; z-index: 20; background: rgba(238,241,244,.94); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
  .filters .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding-top: 10px; padding-bottom: 10px; }
  .seg { display: inline-flex; background: #d9dee4; border-radius: 12px; padding: 3px; }
  .seg button { border: 0; background: none; border-radius: 9px; padding: 7px 13px; font-weight: 600; color: #4a5866; min-height: 36px; white-space: nowrap; }
  .seg button.on { background: #fff; color: var(--ink); box-shadow: 0 1px 2px rgba(33,51,74,.18); }
  
  select.period { border: 0; background: #d9dee4; border-radius: 12px; padding: 9px 12px; font: 600 15px var(--body); color: var(--ink); min-height: 42px; }
  .morebtn { border: 1px solid #c4ccd4; background: #fff; border-radius: 12px; padding: 8px 14px; font-weight: 600; min-height: 42px; }
  .morebtn b { background: var(--fire); color: #fff; border-radius: 999px; padding: 0 7px; font-size: 13px; margin-left: 4px; }
  .fpanel { display: none; width: 100%; background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; margin-top: 4px; }
  .fpanel.on { display: grid; gap: 12px; }
  .fgroup h4 { margin: 0 0 6px; font: 700 13px var(--display); letter-spacing: .08em; color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { border: 1px solid #c4ccd4; background: #fff; border-radius: 999px; padding: 6px 12px; font-size: 15px; font-weight: 500; }
  .chip.on { background: var(--ink); border-color: var(--ink); color: #fff; }
  .fpanel .reset { justify-self: start; border: 0; background: none; color: var(--fire-dk); font-weight: 600; padding: 0; }
  .custom { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .custom input { border: 1px solid #c4ccd4; border-radius: 10px; padding: 7px 10px; font: 15px var(--body); }

  .hero { background: var(--ink); color: #fff; border-radius: 24px; padding: 26px 28px 24px; margin: 18px 0 14px; }
  .hero-k { margin: 0; color: var(--hivis); font: 700 14px var(--display); letter-spacing: .1em; }
  .hero-grid { display: grid; grid-template-columns: 1.3fr 1fr 1fr; gap: 20px; align-items: end; margin-top: 6px; }
  .hero-big { font: 700 92px/.92 var(--display); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .hero-big + p, .hero-s p { margin: 6px 0 0; color: #c9d3dd; font-size: 16px; }
  .hero-s strong { display: block; font: 700 44px/1 var(--display); font-variant-numeric: tabular-nums; }
  .progress { margin-top: 22px; }
  .pbar { display: flex; height: 22px; border-radius: 11px; overflow: hidden; background: rgba(255,255,255,.08); }
  .pbar span { display: block; height: 100%; }
  .pbar .s-paid { background: #fff; } .pbar .s-inv { background: #a9bdd1; } .pbar .s-done { background: #6f8aa7; } .pbar .s-appr { background: #4c6584; }
  .pbar .s-pipe { background: repeating-linear-gradient(135deg, #3f5876 0 5px, #33496a 5px 10px); }
  .pkey { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 10px; color: #c9d3dd; font-size: 14px; }
  .pkey i { display: inline-block; width: 11px; height: 11px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
  .pkey b { color: #fff; font-weight: 600; }

  .kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; margin-bottom: 14px; }
  .kpi { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 16px 18px; display: grid; gap: 2px; position: relative; }
  .kpi .l { color: var(--muted); font-weight: 600; font-size: 15px; display: flex; align-items: center; gap: 7px; }
  .kpi .l i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
  .kpi .v { font: 700 36px/1.05 var(--display); font-variant-numeric: tabular-nums; }
  .kpi .n { color: var(--muted); font-size: 14px; }
  .kpi .n.bad { color: var(--red); font-weight: 600; }

  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 20px 22px; margin-bottom: 14px; }
  .p-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 16px; margin-bottom: 12px; }
  .p-head h3 { margin: 0; font: 700 24px var(--display); }
  .p-head p { margin: 0; color: var(--muted); font-size: 15px; }
  .p-tools { display: flex; gap: 8px; align-items: center; }
  .two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; }
  .two > .panel { margin-bottom: 0; }
  .two { margin-bottom: 14px; }

  .chart { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .chart svg { display: block; width: 100%; min-width: 680px; height: auto; }
  .chart .grid { stroke: #e9edf1; }
  .chart .ax { fill: #7b8792; font: 500 12px var(--body); }
  .chart .ax.now { fill: var(--ink); font-weight: 700; }
  .chart .tot { fill: var(--ink); font: 700 12px var(--body); }
  .chart .today { stroke: var(--hivis); stroke-width: 2.5; stroke-dasharray: 4 3; }
  .chart .todayl { fill: #9a7a00; font: 700 11px var(--body); }
  .chart .hit { fill: transparent; }
  .chart .col:hover .hit { fill: rgba(33,51,74,.05); }
  .key { display: flex; flex-wrap: wrap; gap: 6px 16px; color: var(--muted); font-size: 14px; margin-top: 10px; }
  .key i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
  .hatch { background: repeating-linear-gradient(135deg, #b8c4cf 0 3px, #eef1f4 3px 6px); }

  .split { display: grid; gap: 16px; }
  .split-row { display: grid; grid-template-columns: 140px minmax(0, 1fr) 130px; gap: 14px; align-items: center; }
  .split-name { font: 700 22px var(--display); }
  .split-name.Frontline { color: var(--fire-dk); }
  .split-name span { display: block; font: 500 13px var(--body); color: var(--muted); }
  .sbar { display: flex; height: 26px; border-radius: 8px; overflow: hidden; background: #f0f2f5; }
  .sbar span { display: block; height: 100%; }
  .split-v { text-align: right; font: 700 26px var(--display); font-variant-numeric: tabular-nums; }
  .split-v span { display: block; font: 500 13px var(--body); color: var(--muted); }

  .rank { display: grid; gap: 10px; }
  .r-row { display: grid; grid-template-columns: minmax(110px, 170px) minmax(0, 1fr) 96px; gap: 12px; align-items: center; cursor: pointer; border-radius: 8px; }
  .r-row:hover .r-name { color: var(--fire-dk); }
  .r-name { font-weight: 600; line-height: 1.2; }
  .r-name span { display: block; color: var(--muted); font-weight: 400; font-size: 13px; }
  .r-bar { height: 14px; border-radius: 7px; background: #f0f2f5; overflow: hidden; display: flex; }
  .r-bar span { display: block; height: 100%; }
  .r-v { text-align: right; font: 700 19px var(--display); font-variant-numeric: tabular-nums; }

  .pay { display: grid; gap: 0; }
  .pay-row { display: grid; grid-template-columns: 92px minmax(0, 1fr) 110px; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid #eef1f4; }
  .pay-row:last-child { border-bottom: 0; }
  .pay-d { font: 700 18px/1.1 var(--display); }
  .pay-d span { display: block; font: 500 12px var(--body); color: var(--muted); }
  .pay-row.late .pay-d { color: var(--red); }
  .pay-j { min-width: 0; }
  .pay-j b { font-weight: 600; }
  .pay-j div { color: var(--muted); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pay-v { text-align: right; font: 700 20px var(--display); font-variant-numeric: tabular-nums; }
  .tag { display: inline-block; font: 600 12px var(--body); border-radius: 6px; padding: 1px 7px; margin-left: 6px; vertical-align: 1px; }
  .tag.Veridian { background: var(--vp-lt); color: var(--vp); } .tag.Frontline { background: #fde3d8; color: var(--fire-dk); } .tag.Pulse { background: var(--pu-lt); color: #4b6178; }
  .tag.late { background: #fde2e2; color: var(--red); }
  .tag.est { background: #eef1f4; color: var(--muted); }

  .fl { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 18px; align-items: center; background: #fff; border: 1px solid var(--line); border-left: 0; }
  .fl-logo { background: var(--ink); border-radius: 14px; padding: 14px 16px; }
  .fl-logo img { height: 34px; display: block; }
  .fl-nums { display: flex; flex-wrap: wrap; gap: 10px 28px; }
  .fl-nums div { font: 700 30px/1 var(--display); }
  .fl-nums span { display: block; font: 500 14px var(--body); color: var(--muted); margin-top: 3px; }
  .fl a { color: var(--fire-dk); font-weight: 600; }

  .jobs-tools { display: flex; gap: 8px; flex-wrap: wrap; }
  .jobs-tools input { flex: 1 1 220px; border: 1px solid #c4ccd4; border-radius: 12px; padding: 10px 12px; font: 16px var(--body); }
  table.jobs { width: 100%; border-collapse: collapse; font-size: 15px; margin-top: 10px; }
  table.jobs th { text-align: left; color: var(--muted); font-weight: 600; font-size: 13px; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  table.jobs td { padding: 9px 8px; border-bottom: 1px solid #eef1f4; vertical-align: top; }
  table.jobs td.num { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
  table.jobs tr.mhead td { background: #f5f7f9; font: 700 16px var(--display); color: var(--ink); }
  table.jobs tr.mhead td.num { font: 700 16px var(--display); }
  .st { display: inline-block; font-size: 13px; font-weight: 600; border-radius: 6px; padding: 1px 8px; white-space: nowrap; }
  .st.paid { background: var(--ink); color: #fff; } .st.invoiced { background: #dbe5ef; color: #2c4a6a; } .st.done { background: #e6edf3; color: #3d5670; }
  .st.approved { background: #eef2f6; color: #3d5670; } .st.quoted, .st.rfq, .st.planned { background: #f3f4f6; color: var(--muted); } .st.lost { background: #fde2e2; color: var(--red); }
  .tablewrap { overflow-x: auto; }
  .more { margin-top: 12px; border: 1px solid #c4ccd4; background: #fff; border-radius: 12px; padding: 9px 16px; font-weight: 600; }
  .muted { color: var(--muted); }
  .foot { text-align: center; color: var(--muted); font-size: 14px; margin-top: 18px; }
  .empty { color: var(--muted); padding: 10px 0; }

  #tip { position: absolute; z-index: 50; background: var(--ink2); color: #fff; border-radius: 10px; padding: 10px 12px; font-size: 14px; line-height: 1.5; pointer-events: none; opacity: 0; transition: opacity .12s; box-shadow: 0 8px 24px rgba(24,39,57,.28); min-width: 190px; }
  #tip.on { opacity: 1; }
  #tip strong { display: block; font: 700 16px var(--display); margin-bottom: 2px; }
  #tip div { display: flex; justify-content: space-between; gap: 16px; color: #c9d3dd; }
  #tip div b { color: #fff; font-weight: 600; }
  #tip i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 6px; }

  .enter .grow { animation: rise .7s cubic-bezier(.2,.8,.2,1) both; transform-box: fill-box; transform-origin: bottom; animation-delay: calc(var(--i, 0) * 28ms + 120ms); }
  .enter .pbar span { animation: widen .9s cubic-bezier(.2,.8,.2,1) both; transform-origin: left; }
  @keyframes rise { from { transform: scaleY(0); } to { transform: scaleY(1); } }
  @keyframes widen { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @media (prefers-reduced-motion: reduce) { .enter .grow, .enter .pbar span { animation: none; } }

  @media (max-width: 1000px) {
    .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .kpis .kpi:first-child { grid-column: 1 / -1; }
    .two { grid-template-columns: minmax(0, 1fr); }
    .two > .panel { margin-bottom: 0; }
    .hero-grid { grid-template-columns: 1fr 1fr; }
    .hero-grid > :first-child { grid-column: 1 / -1; }
  }
  @media (max-width: 600px) {
    .wrap { padding: 0 12px 50px; }
    .marks { gap: 8px; } .marks img { height: 24px; } .vpmark { font-size: 15px; letter-spacing: .08em; } .vpmark small { font-size: 8px; letter-spacing: .2em; } .marks .plus { font-size: 16px; }
    .top-r .upd { display: none; }
    .hero { padding: 20px 18px; border-radius: 18px; }
    .hero-big { font-size: 64px; }
    .hero-s strong { font-size: 32px; }
    .kpi .v { font-size: 30px; }
    .panel { padding: 16px; border-radius: 16px; }
    .split-row { grid-template-columns: 1fr auto; } .split-row .sbar { grid-column: 1 / -1; grid-row: 2; }
    .r-row { grid-template-columns: minmax(0, 1fr) 88px; } .r-row .r-bar { grid-column: 1 / -1; grid-row: 2; }
    .pay-row { grid-template-columns: 70px minmax(0, 1fr) 84px; }
    table.jobs .hide-s { display: none; }
  }
  @media print {
    .filters, .btn-ghost, .more, .jobs-tools, #tip { display: none !important; }
    body { background: #fff; }
    .hero, .panel, .kpi { break-inside: avoid; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="marks"><div class="vpmark">VERIDIAN<small>PROJECTS</small></div><span class="plus">+</span><img src="https://jeffbuilt.github.io/frontline-passive/logo-header.png" alt="Frontline Compliance and Fire"><span class="plus">+</span><div class="vpmark pulse">PULSE<small>IoT SENSORS</small></div></div>
  <div class="top-r"><span class="upd" id="upd"></span><button class="btn-ghost" id="refresh">Refresh</button></div>
</div></header>
<div class="filters"><div class="wrap" id="filters"></div></div>
<main class="wrap" id="main"></main>
<div id="tip" role="tooltip"></div>

<script>
const DATA = /*__DATA__*/null;
'use strict';

const STAGES = [
  { k: 'paid', name: 'Paid', color: 'var(--paid)', hex: '#21334a' },
  { k: 'invoiced', name: 'Invoiced, waiting on payment', short: 'Invoiced', color: 'var(--inv)', hex: '#4b6a8c' },
  { k: 'done', name: 'Done, not invoiced', short: 'Done', color: 'var(--done)', hex: '#8fa6bf' },
  { k: 'approved', name: 'Approved (WO), to do', short: 'Approved', color: 'var(--appr)', hex: '#c5d2de' },
  { k: 'pipe', name: 'Quoted, RFQ or planned', short: 'Pipeline', color: 'url(#hatch)', hex: '#b8c4cf', hatch: true },
];
const PIPE = ['quoted', 'rfq', 'planned'];
const stageOf = j => PIPE.includes(j.stage) ? 'pipe' : j.stage;
const STATUS_GROUPS = [['paid', 'Paid'], ['invoiced', 'Invoiced'], ['done', 'Done'], ['approved', 'Approved'], ['quoted', 'Quoted'], ['rfq', 'RFQ'], ['planned', 'Planned']];
const BIZ = { Veridian: { color: '#21334a', light: '#e1e6ec', note: 'Filters, mechanical, reports', short: 'VP' }, Frontline: { color: '#e8572a', light: '#fde3d8', note: 'Passive fire, repairs, SIT', short: 'FL' }, Pulse: { color: '#8fa6bf', light: '#eef2f6', note: 'IoT sensors and subscriptions', short: 'PU' } };
const BIZ_NAMES = Object.keys(BIZ);

const $ = s => document.querySelector(s), $$ = s => Array.from(document.querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = n => '$' + Math.round(n || 0).toLocaleString('en-AU');
const k$ = n => Math.abs(n) >= 1e6 ? '$' + (n / 1e6).toFixed(2) + 'm' : Math.abs(n) >= 1000 ? '$' + (n / 1000).toFixed(Math.abs(n) >= 100000 ? 0 : 1) + 'k' : money(n);
const ym = d => d.slice(0, 7);
function addM(m, n) { const [y, mo] = m.split('-').map(Number); const d = new Date(y, mo - 1 + n, 1); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); }
function mShort(m) { const [y, mo] = m.split('-').map(Number); return new Date(y, mo - 1, 1).toLocaleDateString('en-AU', { month: 'short' }) + (mo === 1 || mo === 7 ? ' ' + String(y).slice(2) : ''); }
function mLong(m) { const [y, mo] = m.split('-').map(Number); return new Date(y, mo - 1, 1).toLocaleDateString('en-AU', { month: 'long', year: 'numeric' }); }
function dShort(d) { const [y, m, dd] = d.split('-').map(Number); return new Date(y, m - 1, dd).toLocaleDateString('en-AU', { day: 'numeric', month: 'short' }); }

let D = DATA;
const TODAY = () => D.today;
const NOW = () => ym(D.today);
function fyOf(m) { const [y, mo] = m.split('-').map(Number); return mo >= 7 ? y : y - 1; } // FY starting July of y
function periods() {
  const now = NOW(), fy = fyOf(now);
  const fyName = y => `FY ${String(y).slice(2)}/${String(y + 1).slice(2)}`;
  return [
    { k: 'fy', name: `This financial year (${fyName(fy)})`, from: `${fy}-07`, to: `${fy + 1}-06` },
    { k: 'nfy', name: `Next financial year (${fyName(fy + 1)})`, from: `${fy + 1}-07`, to: `${fy + 2}-06` },
    { k: 'lfy', name: `Last financial year (${fyName(fy - 1)})`, from: `${fy - 1}-07`, to: `${fy}-06` },
    { k: 'n12', name: 'Next 12 months', from: now, to: addM(now, 11) },
    { k: 'l12', name: 'Last 12 months', from: addM(now, -11), to: now },
    { k: 'cy', name: `Calendar ${now.slice(0, 4)}`, from: `${now.slice(0, 4)}-01`, to: `${now.slice(0, 4)}-12` },
    { k: 'cy1', name: `Calendar ${Number(now.slice(0, 4)) + 1}`, from: `${Number(now.slice(0, 4)) + 1}-01`, to: `${Number(now.slice(0, 4)) + 1}-12` },
    { k: 'all', name: 'Everything in the register', from: '2000-01', to: '2099-12' },
    { k: 'custom', name: 'Custom…' },
  ];
}

const F = { biz: 'Both', period: 'fy', from: '', to: '', cats: [], sites: [], statuses: [], q: '', panel: false, colourBy: 'biz', showJobs: innerWidth < 600 ? 25 : 60, animated: false };
try { Object.assign(F, JSON.parse(localStorage.getItem('hq_f') || '{}'), { panel: false, showJobs: innerWidth < 600 ? 25 : 60, animated: false }); } catch (e) {}
const saveF = () => { try { localStorage.setItem('hq_f', JSON.stringify({ biz: F.biz, period: F.period, from: F.from, to: F.to, cats: F.cats, sites: F.sites, statuses: F.statuses, colourBy: F.colourBy })); } catch (e) {} };

function range() {
  const p = periods().find(x => x.k === F.period) || periods()[0];
  if (p.k === 'custom') return { from: F.from || addM(NOW(), -6), to: F.to || addM(NOW(), 5), name: 'Custom' };
  return p;
}
function filtered(opts) {
  opts = opts || {};
  return D.jobs.filter(j => j.stage !== 'lost' && j.price > 0
    && (F.biz === 'Both' || j.business === F.biz)
    && (!F.cats.length || F.cats.includes(j.category))
    && (!F.sites.length || F.sites.includes(j.site))
    && (!F.statuses.length || F.statuses.includes(j.stage))
    && (opts.noRange || (j.month >= range().from && j.month <= range().to)));
}
// when the money lands: paid jobs use the payment batch month if we have it; everything else end of month + 45 days
const pbByRef = {};
function cashMonth(j) {
  if (j.stage === 'paid') { const p = pbByRef[j.ref]; return p ? p.month : ym(j.due); }
  return ym(j.due);
}

/* ---------- filters bar ---------- */
function renderFilters() {
  const r = range();
  const cats = [...new Set(D.jobs.map(j => j.category))].sort();
  const sites = [...new Set(D.jobs.map(j => j.site))].sort();
  const n = F.cats.length + F.sites.length + F.statuses.length;
  $('#filters').innerHTML = `
    <div class="seg" role="tablist" aria-label="Business">${['Both', ...BIZ_NAMES].map(b => `<button class="${F.biz === b ? 'on' : ''} b-${b}" data-biz="${b}">${b === 'Both' ? 'Combined' : b}</button>`).join('')}</div>
    <select class="period" id="period" aria-label="Period">${periods().map(p => `<option value="${p.k}" ${p.k === F.period ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}</select>
    <button class="morebtn" id="more">Filters${n ? `<b>${n}</b>` : ''}</button>
    <div class="fpanel ${F.panel ? 'on' : ''}">
      ${F.period === 'custom' ? `<div class="fgroup"><h4>Custom range</h4><div class="custom"><input type="month" id="from" value="${r.from}"> to <input type="month" id="to" value="${r.to}"></div></div>` : ''}
      <div class="fgroup"><h4>Job type</h4><div class="chips">${cats.map(c => `<button class="chip ${F.cats.includes(c) ? 'on' : ''}" data-cat="${esc(c)}">${esc(c)}</button>`).join('')}</div></div>
      <div class="fgroup"><h4>Site</h4><div class="chips">${sites.map(c => `<button class="chip ${F.sites.includes(c) ? 'on' : ''}" data-site="${esc(c)}">${esc(c === 'Unassigned' ? 'Not set yet' : c)}</button>`).join('')}</div></div>
      <div class="fgroup"><h4>Status</h4><div class="chips">${STATUS_GROUPS.map(([k, l]) => `<button class="chip ${F.statuses.includes(k) ? 'on' : ''}" data-stat="${k}">${l}</button>`).join('')}</div></div>
      ${n ? '<button class="reset" id="reset">Clear filters</button>' : ''}
    </div>`;
  $$('[data-biz]').forEach(b => b.onclick = () => { F.biz = b.dataset.biz; F.animated = false; go(); });
  $('#period').onchange = e => { F.period = e.target.value; if (F.period === 'custom') F.panel = true; F.animated = false; go(); };
  $('#more').onclick = () => { F.panel = !F.panel; renderFilters(); };
  const tog = (arr, v) => arr.includes(v) ? arr.filter(x => x !== v) : arr.concat(v);
  $$('[data-cat]').forEach(b => b.onclick = () => { F.cats = tog(F.cats, b.dataset.cat); go(); });
  $$('[data-site]').forEach(b => b.onclick = () => { F.sites = tog(F.sites, b.dataset.site); go(); });
  $$('[data-stat]').forEach(b => b.onclick = () => { F.statuses = tog(F.statuses, b.dataset.stat); go(); });
  const rs = $('#reset'); if (rs) rs.onclick = () => { F.cats = []; F.sites = []; F.statuses = []; go(); };
  const fr = $('#from'), to = $('#to');
  if (fr) fr.onchange = () => { F.from = fr.value; go(); };
  if (to) to.onchange = () => { F.to = to.value; go(); };
}

/* ---------- hero ---------- */
function sumBy(list, fn) { const o = {}; list.forEach(j => { const k = fn(j); o[k] = (o[k] || 0) + j.price; }); return o; }
function renderHero(list) {
  const r = range();
  const s = sumBy(list, stageOf);
  const total = list.reduce((t, j) => t + j.price, 0);
  const earned = (s.paid || 0) + (s.invoiced || 0);
  const cashIn = D.cash.filter(c => c.month >= r.from && c.month <= r.to && c.month <= NOW() && inScopeRef(c.ref)).reduce((t, c) => t + c.net, 0);
  const pct = v => total ? (v / total * 100) : 0;
  const who = F.biz === 'Both' ? 'Veridian + Frontline + Pulse' : F.biz;
  return `<section class="hero">
    <p class="hero-k">${esc(who)} · ${esc(r.k === 'custom' ? mShort(r.from) + ' to ' + mShort(r.to) : periods().find(p => p.k === r.k).name)}</p>
    <div class="hero-grid">
      <div><div class="hero-big" data-count="${total}">${k$(total)}</div><p>expected income, ex GST</p></div>
      <div class="hero-s"><strong data-count="${earned}">${k$(earned)}</strong><p>invoiced or paid (${Math.round(pct(earned))}%)</p></div>
      <div class="hero-s"><strong data-count="${cashIn}">${k$(cashIn)}</strong><p>cash received after PB</p></div>
    </div>
    <div class="progress"><div class="pbar">${STAGES.map(st => `<span class="s-${st.k === 'invoiced' ? 'inv' : st.k === 'approved' ? 'appr' : st.k}" style="width:${pct(s[st.k] || 0)}%"></span>`).join('')}</div>
      <div class="pkey">${STAGES.map(st => `<span><i class="s-${st.k === 'invoiced' ? 'inv' : st.k === 'approved' ? 'appr' : st.k}" style="background:${st.k === 'paid' ? '#fff' : st.k === 'invoiced' ? '#a9bdd1' : st.k === 'done' ? '#6f8aa7' : st.k === 'approved' ? '#4c6584' : ''}${st.k === 'pipe' ? ';background:repeating-linear-gradient(135deg,#6f8aa7 0 3px,#33496a 3px 6px)' : ''}"></i>${esc(st.short || st.name)} <b>${k$(s[st.k] || 0)}</b></span>`).join('')}</div></div>
  </section>`;
}
function inScopeRef(ref) {
  const j = D.jobs.find(x => x.ref === ref);
  if (!j) return F.biz === 'Both' && !F.cats.length && !F.sites.length && !F.statuses.length;
  return (F.biz === 'Both' || j.business === F.biz) && (!F.cats.length || F.cats.includes(j.category)) && (!F.sites.length || F.sites.includes(j.site)) && (!F.statuses.length || F.statuses.includes(j.stage));
}

/* ---------- KPIs ---------- */
function renderKpis(list) {
  const s = sumBy(list, stageOf), c = {};
  list.forEach(j => { const k = stageOf(j); c[k] = (c[k] || 0) + 1; });
  const late = filtered({ noRange: true }).filter(j => j.stage === 'invoiced' && j.due < TODAY());
  const lateV = late.reduce((t, j) => t + j.price, 0);
  const cell = (st, note, extra) => `<div class="kpi"><span class="l"><i style="background:${st.hatch ? 'repeating-linear-gradient(135deg,#b8c4cf 0 3px,#eef1f4 3px 6px)' : st.hex}"></i>${esc(st.short || st.name)}</span><span class="v">${money(s[st.k] || 0)}</span><span class="n ${extra ? 'bad' : ''}">${note}</span></div>`;
  return `<div class="kpis">
    ${cell(STAGES[0], `${c.paid || 0} jobs`)}
    ${cell(STAGES[1], lateV ? `${money(lateV)} overdue (${late.length})` : `${c.invoiced || 0} jobs, none overdue`, lateV)}
    ${cell(STAGES[2], `${c.done || 0} jobs ready to invoice`)}
    ${cell(STAGES[3], `${c.approved || 0} jobs with a WO`)}
    ${cell(STAGES[4], `${c.pipe || 0} quoted, RFQ or planned`)}
  </div>`;
}

/* ---------- month chart (income by work month, or cash by payment month) ---------- */
function monthsIn(r) {
  const out = []; let m = r.from === '2000-01' ? D.jobs.reduce((a, j) => j.month < a ? j.month : a, '9999') : r.from;
  const end = r.to === '2099-12' ? D.jobs.reduce((a, j) => j.month > a ? j.month : a, '0000') : r.to;
  for (let i = 0; m <= end && i < 48; i++, m = addM(m, 1)) out.push(m);
  return out;
}
function barChart(id, months, cols, opts) {
  // cols: per month { m, parts: [{k, v, color, hatch, label}], total }
  const W = Math.max(680, months.length * 58), H = 300, pl = 54, pb = 40, pt = 22;
  const max0 = Math.max(1, ...cols.map(c => c.total), opts.target || 0);
  const step = [1000, 2500, 5000, 10000, 20000, 25000, 50000, 100000, 200000].find(v => max0 * 1.1 / v <= 5) || 250000;
  const max = Math.ceil(max0 * 1.1 / step) * step;
  const y = v => pt + (H - pt - pb) * (1 - v / max);
  const cw = (W - pl - 6) / months.length, bw = Math.min(40, cw * 0.66);
  const ticks = []; for (let t = 0; t <= max; t += step) ticks.push(t);
  const ni = months.indexOf(NOW());
  return `<div class="chart" id="${id}"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.label)}">
    <defs><pattern id="hatch-${id}" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#eef1f4"/><rect width="2.6" height="6" fill="#aab7c3"/></pattern>
      <pattern id="hatchF-${id}" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#fde3d8"/><rect width="2.6" height="6" fill="#e8572a"/></pattern>
      <pattern id="hatchV-${id}" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#e1e6ec"/><rect width="2.6" height="6" fill="#21334a"/></pattern>
      <pattern id="hatchP-${id}" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#eef2f6"/><rect width="2.6" height="6" fill="#8fa6bf"/></pattern></defs>
    ${ticks.map(t => `<line class="grid" x1="${pl}" x2="${W}" y1="${y(t)}" y2="${y(t)}"/><text class="ax" x="${pl - 8}" y="${y(t) + 4}" text-anchor="end">${t ? k$(t) : '0'}</text>`).join('')}
    ${cols.map((c, i) => {
      const x = pl + i * cw + (cw - bw) / 2; let acc = 0;
      const rects = c.parts.filter(p => p.v > 0).map(p => {
        const y1 = y(acc + p.v), y0 = y(acc); acc += p.v;
        const fill = p.hatch ? `url(#${p.hatch}-${id})` : p.color;
        return `<rect class="grow" x="${x}" y="${y1}" width="${bw}" height="${Math.max(0, y0 - y1)}" fill="${fill}"/>`;
      }).join('');
      const tip = [mLong(c.m)].concat(c.parts.filter(p => p.v > 0).map(p => `${p.tipColor || p.color}~${p.label}~${money(p.v)}`)).concat(c.total ? [`~Total~${money(c.total)}`] : ['~Nothing in this month~']).join('|');
      return `<g class="col" style="--i:${i}" data-tip="${esc(tip)}"><rect class="hit" x="${pl + i * cw}" y="${pt}" width="${cw}" height="${H - pt - pb}"/>${rects}
        ${c.total ? `<text class="tot" x="${x + bw / 2}" y="${y(c.total) - 6}" text-anchor="middle">${k$(c.total)}</text>` : ''}
        <text class="ax ${c.m === NOW() ? 'now' : ''}" x="${x + bw / 2}" y="${H - 16}" text-anchor="middle">${mShort(c.m)}</text></g>`;
    }).join('')}
    ${ni >= 0 ? `<line class="today" x1="${pl + ni * cw + 2}" x2="${pl + ni * cw + 2}" y1="${pt - 6}" y2="${H - pb}"/><text class="todayl" x="${pl + ni * cw - 4}" y="${pt + 2}" text-anchor="end">Today</text>` : ''}
  </svg></div>`;
}
function stageParts(list) {
  const s = sumBy(list, stageOf);
  return STAGES.map(st => ({ k: st.k, v: s[st.k] || 0, color: st.hex, hatch: st.hatch ? 'hatch' : '', label: st.short || st.name }));
}
function bizParts(list) {
  const out = [];
  BIZ_NAMES.forEach(b => {
    const l = list.filter(j => j.business === b);
    const firm = l.filter(j => stageOf(j) !== 'pipe').reduce((t, j) => t + j.price, 0);
    const pipe = l.filter(j => stageOf(j) === 'pipe').reduce((t, j) => t + j.price, 0);
    out.push({ v: firm, color: BIZ[b].color, label: b + ', confirmed' }, { v: pipe, color: BIZ[b].color, hatch: { Veridian: 'hatchV', Frontline: 'hatchF', Pulse: 'hatchP' }[b], label: b + ', pipeline', tipColor: BIZ[b].color });
  });
  return out;
}
function renderIncome(list) {
  const months = monthsIn(range());
  const byStage = F.colourBy === 'stage' || F.biz !== 'Both';
  const cols = months.map(m => { const l = list.filter(j => j.month === m); return { m, parts: byStage ? stageParts(l) : bizParts(l), total: l.reduce((t, j) => t + j.price, 0) }; });
  const past = cols.filter(c => c.m < NOW());
  const avg = past.length ? past.reduce((t, c) => t + c.total, 0) / past.length : 0;
  const key = byStage ? STAGES.map(st => `<span><i class="${st.hatch ? 'hatch' : ''}" style="${st.hatch ? '' : 'background:' + st.hex}"></i>${esc(st.name)}</span>`).join('')
    : BIZ_NAMES.map(b => `<span><i style="background:${BIZ[b].color}"></i>${b}</span><span><i style="background:repeating-linear-gradient(135deg,${BIZ[b].color} 0 3px,${BIZ[b].light} 3px 6px)"></i>${b} pipeline</span>`).join('');
  return `<section class="panel"><div class="p-head"><div><h3>Income by month</h3><p>Expected for each work month, and how much of it is real money yet${avg ? ` · ${k$(avg)} a month on average so far` : ''}</p></div>
    ${F.biz === 'Both' ? `<div class="p-tools"><div class="seg">${[['stage', 'By status'], ['biz', 'By business']].map(([k, l]) => `<button class="${F.colourBy === k ? 'on' : ''}" data-colour="${k}">${l}</button>`).join('')}</div></div>` : ''}</div>
    ${barChart('inc', months, cols, { label: 'Expected and actual income by month' })}
    <div class="key">${key}</div></section>`;
}
function renderCash(list) {
  const months = monthsIn(range());
  const all = filtered({ noRange: true });
  const cols = months.map(m => {
    const l = all.filter(j => cashMonth(j) === m);
    const rec = l.filter(j => j.stage === 'paid').reduce((t, j) => t + (pbByRef[j.ref] ? pbByRef[j.ref].net : j.price), 0);
    const late = l.filter(j => j.stage === 'invoiced' && j.due < TODAY()).reduce((t, j) => t + j.price, 0);
    const due = l.filter(j => j.stage === 'invoiced' && j.due >= TODAY()).reduce((t, j) => t + j.price, 0);
    const fc = l.filter(j => j.stage === 'done' || j.stage === 'approved').reduce((t, j) => t + j.price, 0);
    const pipe = l.filter(j => PIPE.includes(j.stage)).reduce((t, j) => t + j.price, 0);
    const parts = [
      { v: rec, color: '#21334a', label: 'Received' },
      { v: late, color: '#c62828', label: 'Overdue' },
      { v: due, color: '#4b6a8c', label: 'Invoiced, due' },
      { v: fc, color: '#8fa6bf', label: 'Work done or approved' },
      { v: pipe, color: '#aab7c3', hatch: 'hatch', label: 'Pipeline' },
    ];
    return { m, parts, total: parts.reduce((t, p) => t + p.v, 0) };
  });
  const next3 = cols.filter(c => c.m >= NOW() && c.m <= addM(NOW(), 2)).reduce((t, c) => t + c.total - (c.parts[4].v), 0);
  return `<section class="panel"><div class="p-head"><div><h3>Cash flow</h3><p>When the money lands: end of the invoice month + ${D.payDays} days. Not invoiced yet is forecast from the end of its work month.</p></div>
    <p><b>${k$(next3)}</b> confirmed to land in the next 3 months</p></div>
    ${barChart('cash', months, cols, { label: 'Cash expected by month' })}
    <div class="key"><span><i style="background:#21334a"></i>Received (after PB)</span><span><i style="background:#c62828"></i>Overdue</span><span><i style="background:#4b6a8c"></i>Invoiced, due</span><span><i style="background:#8fa6bf"></i>Done or approved, forecast</span><span><i class="hatch"></i>Pipeline, forecast</span></div></section>`;
}

/* ---------- business split, job type, site ---------- */
function renderSplit(list) {
  if (F.biz !== 'Both') return '';
  const tot = list.reduce((t, j) => t + j.price, 0) || 1;
  const rows = BIZ_NAMES.map(b => {
    const l = list.filter(j => j.business === b), s = sumBy(l, stageOf), v = l.reduce((t, j) => t + j.price, 0);
    return `<div class="split-row"><div class="split-name ${b}">${b}<span>${BIZ[b].note}</span></div>
      <div class="sbar" style="width:${Math.max(4, v / tot * 100)}%">${STAGES.map(st => `<span class="${st.hatch ? 'hatch' : ''}" style="width:${v ? (s[st.k] || 0) / v * 100 : 0}%;${st.hatch ? '' : 'background:' + (st.k === 'paid' ? BIZ[b].color : st.hex)}"></span>`).join('')}</div>
      <div class="split-v">${k$(v)}<span>${Math.round(v / tot * 100)}% of the total</span></div></div>`;
  }).join('');
  return `<section class="panel"><div class="p-head"><div><h3>Veridian, Frontline and Pulse</h3><p>Same period and filters. Each business's own colour is paid, then invoiced, done, approved and pipeline.</p></div></div><div class="split">${rows}</div></section>`;
}
function rankPanel(title, note, list, keyFn, filterKey, nameFn) {
  const by = {};
  list.forEach(j => { const k = keyFn(j); (by[k] = by[k] || { v: 0, n: 0, s: {}, b: j.business }); by[k].v += j.price; by[k].n++; by[k].s[stageOf(j)] = (by[k].s[stageOf(j)] || 0) + j.price; });
  const rows = Object.entries(by).sort((a, b) => b[1].v - a[1].v).slice(0, 10);
  const max = rows.length ? rows[0][1].v : 1;
  return `<section class="panel"><div class="p-head"><div><h3>${title}</h3><p>${note}</p></div></div>
    ${rows.length ? `<div class="rank">${rows.map(([k, o]) => `<div class="r-row" data-${filterKey}="${esc(k)}" title="Filter to ${esc(k)}"><div class="r-name">${esc(nameFn ? nameFn(k) : k)}<span>${o.n} job${o.n === 1 ? '' : 's'}</span></div>
      <div class="r-bar" style="width:${Math.max(3, o.v / max * 100)}%">${STAGES.map(st => `<span class="${st.hatch ? 'hatch' : ''}" style="width:${(o.s[st.k] || 0) / o.v * 100}%;${st.hatch ? '' : 'background:' + st.hex}"></span>`).join('')}</div>
      <div class="r-v">${k$(o.v)}</div></div>`).join('')}</div>` : '<p class="empty">Nothing matches these filters.</p>'}</section>`;
}

/* ---------- payments coming in ---------- */
function renderPayments() {
  const all = filtered({ noRange: true }).filter(j => j.stage === 'invoiced' || j.stage === 'done');
  const list = all.sort((a, b) => a.due.localeCompare(b.due)).slice(0, 12);
  return `<section class="panel"><div class="p-head"><div><h3>Money coming in</h3><p>Invoiced first, then done and ready to invoice. Due dates are end of month + ${D.payDays} days.</p></div></div>
    ${list.length ? `<div class="pay">${list.map(j => { const late = j.stage === 'invoiced' && j.due < TODAY(); return `<div class="pay-row ${late ? 'late' : ''}">
      <div class="pay-d">${dShort(j.due)}<span>${late ? 'overdue' : j.stage === 'invoiced' ? 'due' : 'if invoiced now'}</span></div>
      <div class="pay-j"><b>${esc(j.ref || j.job)}</b><span class="tag ${j.business}">${j.business}</span>${late ? '<span class="tag late">Overdue</span>' : j.stage === 'done' ? '<span class="tag est">Not invoiced</span>' : ''}<div>${esc(j.loc || j.job)}</div></div>
      <div class="pay-v">${money(j.price)}</div></div>`; }).join('')}</div>` : '<p class="empty">Nothing invoiced or waiting to be invoiced.</p>'}</section>`;
}

/* ---------- Frontline bank ---------- */
function renderFrontline() {
  if (F.biz === 'Veridian' || !D.frontline) return '';
  const f = D.frontline;
  return `<section class="panel fl"><div class="fl-logo"><img src="https://jeffbuilt.github.io/frontline-passive/logo-header.png" alt="Frontline"></div>
    <div><div class="fl-nums"><div>${money(f.bank)}<span>passive fire in the bank, not on a PO yet (${f.bankN} penetrations)</span></div>
      ${f.repairsOpen ? `<div>${money(f.repairsOpen)}<span>fire repairs quoted or approved</span></div>` : ''}
      ${f.requested ? `<div>${f.requested}<span>client requests to price</span></div>` : ''}</div>
      <p class="muted" style="margin:8px 0 0">Scouted in the Frontline app. It shows up above once it's planned into POs and added to the register. <a href="https://jeffbuilt.github.io/frontline-passive/" target="_blank" rel="noopener">Open Frontline</a></p></div></section>`;
}

/* ---------- jobs ---------- */
function renderJobs(list) {
  const q = F.q.trim().toLowerCase();
  const l = list.filter(j => !q || [j.ref, j.wo, j.loc, j.job, j.status, j.contractor].some(v => String(v).toLowerCase().includes(q))).sort((a, b) => a.month.localeCompare(b.month) || b.price - a.price);
  const shown = l.slice(0, F.showJobs);
  const monthTot = {}; l.forEach(j => monthTot[j.month] = (monthTot[j.month] || 0) + j.price);
  let lastM = '', rows = '';
  shown.forEach(j => {
    if (j.month !== lastM) { lastM = j.month; rows += `<tr class="mhead"><td colspan="4">${mLong(j.month)}</td><td class="hide-s"></td><td class="num">${money(monthTot[j.month])}</td></tr>`; }
    rows += `<tr><td><b>${esc(j.ref)}</b><span class="tag ${j.business}">${BIZ[j.business].short}</span></td><td>${esc(j.loc || '—')}<div class="muted">${esc(j.job)}</div></td>
      <td class="hide-s">${esc(j.site === 'Unassigned' ? '' : j.site)}</td><td><span class="st ${j.stage}">${esc(j.status)}</span></td><td class="hide-s">${j.stage === 'invoiced' || j.stage === 'done' ? dShort(j.due) : ''}</td><td class="num">${money(j.price)}</td></tr>`;
  });
  return `<section class="panel"><div class="p-head"><div><h3>Jobs</h3><p>${l.length} jobs · ${money(l.reduce((t, j) => t + j.price, 0))}</p></div></div>
    <div class="jobs-tools"><input id="q" type="search" placeholder="Search reference, WO, location or job" value="${esc(F.q)}"></div>
    <div class="tablewrap"><table class="jobs"><thead><tr><th>Ref</th><th>Location / job</th><th class="hide-s">Site</th><th>Status</th><th class="hide-s">Pay due</th><th class="num">Price</th></tr></thead><tbody>${rows || '<tr><td colspan="6" class="empty">No jobs match.</td></tr>'}</tbody></table></div>
    ${l.length > F.showJobs ? `<button class="more" id="moreJobs">Show more (${l.length - F.showJobs} left)</button>` : ''}</section>`;
}

/* ---------- page ---------- */
function go() {
  saveF();
  renderFilters();
  const list = filtered();
  $('#main').innerHTML = renderHero(list) + renderKpis(list) + renderIncome(list) + renderCash(list) + renderSplit(list)
    + `<div class="two">${rankPanel('By job type', 'Tap one to filter', list, j => j.category, 'fcat')}${rankPanel('By site', 'Tap one to filter', list, j => j.site, 'fsite', k => k === 'Unassigned' ? 'Not set yet' : k)}</div>`
    + `<div class="two">${renderPayments()}${renderFrontline() || '<div></div>'}</div>`
    + renderJobs(list)
    + `<p class="foot">Live from the Projects register and the Frontline master sheet. Figures ex GST. Lost jobs left out.</p>`;
  $('#upd').textContent = 'Updated ' + new Date(D.built).toLocaleString('en-AU', { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' });
  $$('[data-colour]').forEach(b => b.onclick = () => { F.colourBy = b.dataset.colour; F.animated = false; go(); });
  $$('[data-fcat]').forEach(b => b.onclick = () => { F.cats = [b.dataset.fcat]; go(); window.scrollTo({ top: 0, behavior: 'smooth' }); });
  $$('[data-fsite]').forEach(b => b.onclick = () => { F.sites = [b.dataset.fsite]; go(); window.scrollTo({ top: 0, behavior: 'smooth' }); });
  const q = $('#q');
  if (q) q.oninput = () => { F.q = q.value; clearTimeout(go._t); go._t = setTimeout(() => { const pos = q.selectionStart; go(); const n = $('#q'); n.focus(); n.setSelectionRange(pos, pos); }, 250); };
  const mj = $('#moreJobs'); if (mj) mj.onclick = () => { F.showJobs += 100; go(); };
  bindTips();
  // scroll charts to today on small screens
  ['#inc', '#cash'].forEach(id => { const c = $(id); if (c && c.scrollWidth > c.clientWidth) { const ms = monthsIn(range()), i = ms.indexOf(NOW()); c.scrollLeft = i < 0 ? 0 : Math.max(0, (i - 2) / ms.length * c.scrollWidth); } });
  if (!F.animated && !(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches)) {
    $('#main').classList.add('enter');
    $$('[data-count]').forEach(el => { const to = Number(el.dataset.count), t0 = performance.now(); const tick = t => { const p = Math.min(1, (t - t0) / 1000), e = 1 - Math.pow(1 - p, 3); el.textContent = k$(to * e); if (p < 1) requestAnimationFrame(tick); }; requestAnimationFrame(tick); });
    F.animated = true;
    setTimeout(() => $('#main').classList.remove('enter'), 1800);
  }
}
function bindTips() {
  const tip = $('#tip');
  const show = el => {
    const parts = el.dataset.tip.split('|');
    tip.innerHTML = `<strong>${esc(parts[0])}</strong>` + parts.slice(1).map(p => { const [c, l, v] = p.split('~'); return `<div><span>${c ? `<i style="background:${c}"></i>` : ''}${esc(l)}</span><b>${esc(v || '')}</b></div>`; }).join('');
    tip.classList.add('on');
    const r = el.getBoundingClientRect();
    const x = Math.min(window.innerWidth - tip.offsetWidth - 8, Math.max(8, r.left + r.width / 2 - tip.offsetWidth / 2));
    tip.style.left = x + 'px'; tip.style.top = Math.max(8, r.top + window.scrollY + 10) + 'px';
  };
  $$('[data-tip]').forEach(el => { el.onmouseenter = () => show(el); el.onmouseleave = () => tip.classList.remove('on'); el.onclick = () => show(el); });
  document.addEventListener('scroll', () => tip.classList.remove('on'), { passive: true });
}

$('#refresh').onclick = () => {
  const b = $('#refresh');
  if (window.google && google.script && google.script.run) {
    b.textContent = 'Refreshing…';
    google.script.run.withSuccessHandler(d => { D = d; index(); F.animated = false; go(); b.textContent = 'Refresh'; })
      .withFailureHandler(e => { b.textContent = 'Refresh'; alert('Could not refresh: ' + (e && e.message || e)); }).getData(true);
  } else location.reload();
};
function index() { Object.keys(pbByRef).forEach(k => delete pbByRef[k]); (D.cash || []).forEach(c => { pbByRef[c.ref] = c; }); }

if (D) { index(); go(); } else $('#main').innerHTML = '<section class="panel"><h3>No data</h3><p>Open this page through the dashboard link, not directly.</p></section>';
</script>
</body>
