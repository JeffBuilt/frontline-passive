<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#14202f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Frontline">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Frontline</title>
<style>
@font-face{font-family:Barlow;font-weight:500;src:url(fonts/barlow-latin-500-normal.woff2) format('woff2');font-display:swap}
@font-face{font-family:Barlow;font-weight:600;src:url(fonts/barlow-latin-600-normal.woff2) format('woff2');font-display:swap}
@font-face{font-family:BarlowC;font-weight:700;src:url(fonts/barlow-semi-condensed-latin-700-normal.woff2) format('woff2');font-display:swap}
:root{--bg:#14202f;--card:#1f2f44;--card2:#273a53;--ink:#fff;--mute:#a9b8ca;--line:#34496a;
  --red:#e5484d;--amber:#f5a524;--green:#2fbf71;--flame:#ff6a1a;--blue:#3b82f6;
  --st:env(safe-area-inset-top);--sb:env(safe-area-inset-bottom)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:500 18px/1.3 Barlow,system-ui,sans-serif;-webkit-text-size-adjust:100%}
button,input,textarea{font:inherit;color:inherit}
button{border:0;cursor:pointer;background:none}
#app{min-height:100vh;padding:calc(var(--st) + 10px) 14px calc(var(--sb) + 110px)}
.top{display:flex;align-items:center;gap:10px;margin:0 0 14px}
.top h1{flex:1;margin:0;font:700 28px/1.1 BarlowC,Barlow,sans-serif;letter-spacing:.3px}
.back{width:54px;height:54px;border-radius:16px;background:var(--card);font-size:28px;flex:none}
.sync{font-size:15px;padding:8px 12px;border-radius:12px;background:var(--card);color:var(--mute);white-space:nowrap}
.sync.busy{color:var(--amber)}.sync.off{color:var(--red)}
/* months */
.month{display:block;width:100%;text-align:left;background:var(--card);border-radius:22px;padding:20px 20px 18px;margin:0 0 14px}
.month .mn{font:700 34px/1 BarlowC,Barlow,sans-serif}.month .yr{color:var(--mute);font-size:18px;margin-left:6px}
.money{margin-top:10px;font-size:20px}.money b{font:700 30px BarlowC,Barlow,sans-serif;color:var(--green)}
.bar{height:22px;border-radius:11px;background:#0d1622;overflow:hidden;margin:10px 0 8px;display:flex}
.bar i{display:block;height:100%}.bar .g{background:var(--green)}.bar .a{background:var(--amber)}
.legend{display:flex;gap:14px;color:var(--mute);font-size:16px;flex-wrap:wrap}
.dot{display:inline-block;width:12px;height:12px;border-radius:6px;margin-right:5px;vertical-align:-1px}
/* coming up */
.ahead{background:var(--card);border-radius:22px;padding:14px 14px 6px;margin:0 0 14px}
.ah{color:var(--mute);font-size:16px;font-weight:600;margin:0 4px 8px;text-transform:uppercase;letter-spacing:.5px}
.mini{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:0 6px;border-top:1px solid var(--line);text-align:left}
.mini:first-of-type{border-top:0}
.mm{width:62px;font:700 22px BarlowC,Barlow,sans-serif}
.mbar{flex:1;height:14px;border-radius:7px;background:#0d1622;overflow:hidden}
.mbar i{display:block;height:100%;background:var(--blue);border-radius:7px}
.mv{width:74px;text-align:right;font:700 22px BarlowC,Barlow,sans-serif}
.lt{width:44px;text-align:right}.lowtag{font-size:14px;font-weight:600;color:#000;background:var(--amber);border-radius:8px;padding:2px 8px}
.mini.low .mbar i{background:var(--amber)}
/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -14px 12px;padding:0 14px 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:12px 16px;border-radius:14px;background:var(--card);font-weight:600;font-size:18px;white-space:nowrap}
.chip.on{background:var(--flame);color:#fff}.chip small{opacity:.75;margin-left:4px}
.row{display:flex;gap:10px;margin:0 0 12px}
.toggle{flex:1;padding:14px;border-radius:14px;background:var(--card);font-weight:600;text-align:center}
.toggle.on{background:var(--card2);box-shadow:inset 0 0 0 2px var(--green)}
.search{flex:1.3;padding:14px;border-radius:14px;background:var(--card);border:0;outline:0;min-width:0}
/* job cards */
.job{display:block;width:100%;text-align:left;background:var(--card);border-radius:18px;padding:14px 16px;margin:0 0 12px;border-left:10px solid var(--red)}
.job.amber{border-left-color:var(--amber)}.job.green{border-left-color:var(--green);opacity:.85}
.vp{font:700 30px/1 BarlowC,Barlow,sans-serif;letter-spacing:.3px}
.vp small{font:600 16px Barlow;color:var(--mute);margin-left:8px;letter-spacing:0}
.loc{font:600 22px/1.2 Barlow;margin:6px 0 2px}
.desc{color:var(--mute);font-size:17px}
.pills{display:flex;gap:8px;margin-top:10px}
.pill{flex:1;text-align:center;padding:8px;border-radius:12px;background:#0d1622;font-weight:600;font-size:18px}
.pill.ok{background:rgba(47,191,113,.18);color:#7ee2a8}.pill.no{background:rgba(229,72,77,.18);color:#ff9a9d}
.empty{color:var(--mute);text-align:center;padding:40px 10px;font-size:20px}
/* job screen */
.jh{background:var(--card);border-radius:20px;padding:16px 18px 18px;margin:0 0 14px}
.badge{display:inline-flex;align-items:center;gap:6px;padding:6px 12px 6px 10px;border-radius:999px;font-weight:600;font-size:16px}
.badge.red{background:rgba(229,72,77,.16);color:#ff8f93}.badge.amber{background:rgba(245,165,36,.16);color:#ffc261}.badge.green{background:rgba(47,191,113,.16);color:#6fe0a0}
.jl{font:700 26px/1.2 BarlowC,Barlow,sans-serif;margin:12px 0 8px}
.meta{display:flex;align-items:center;gap:10px;color:var(--mute);font-size:16px;flex-wrap:wrap}
.tag{background:#0d1622;color:var(--ink);border-radius:8px;padding:3px 10px;font-weight:600;font-size:15px}
.ul{color:var(--mute);font-size:15px;margin:16px 0 0}.ul span{opacity:.7}
.units{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.unit{padding:11px 14px;border-radius:12px;background:#0d1622;font-weight:600;font-size:18px;border:2px solid transparent}
.unit.on{border-color:var(--blue);background:rgba(59,130,246,.18)}
.sect{background:var(--card);border-radius:20px;padding:16px;margin:0 0 14px}
.sh{display:flex;justify-content:space-between;align-items:center;margin:0 0 12px}
.st{font:700 24px BarlowC,Barlow,sans-serif;letter-spacing:.2px}
.cnt{display:inline-flex;align-items:center;gap:5px;font-weight:600;font-size:16px;padding:5px 12px;border-radius:999px}
.cnt.ok{background:rgba(47,191,113,.16);color:#6fe0a0}.cnt.no{background:#0d1622;color:var(--mute)}
.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 0 14px}
.thumbs button{aspect-ratio:1;border-radius:12px;overflow:hidden;background:#0d1622;position:relative;padding:0}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.thumbs .q{position:absolute;left:0;right:0;bottom:0;font-size:11px;background:rgba(245,165,36,.92);color:#000;font-weight:600;padding:2px 0;text-align:center}
.none{grid-column:1/-1;border:2px dashed var(--line);border-radius:14px;color:var(--mute);text-align:center;padding:22px 10px;font-size:16px}
.acts{display:grid;grid-template-columns:1.25fr 1fr;gap:10px}
.pbtn,.sbtn{display:flex;align-items:center;justify-content:center;gap:10px;height:64px;border-radius:16px;font:700 20px BarlowC,Barlow,sans-serif;letter-spacing:.2px}
.pbtn{background:var(--flame);color:#fff;box-shadow:0 4px 14px rgba(255,106,26,.25)}
.sbtn{background:transparent;border:2px solid var(--line);color:var(--ink)}
.pbtn:active,.sbtn:active,.rowbtn:active,.fin:active{transform:scale(.98)}
.rowbtn{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border-radius:20px;padding:16px 16px;margin:0 0 14px;color:var(--ink)}
.rowbtn .ri{width:48px;height:48px;border-radius:14px;background:#0d1622;display:flex;align-items:center;justify-content:center;flex:none}
.rowbtn .rt{flex:1;font:700 21px BarlowC,Barlow,sans-serif}.rowbtn small{display:block;font:500 15px Barlow;color:var(--mute)}
.rowbtn>svg{color:var(--mute)}
.fin{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:68px;border-radius:18px;background:var(--green);color:#06210f;font:700 22px BarlowC,Barlow,sans-serif}
.fin:disabled{background:var(--card);color:var(--mute)}
.hint{color:var(--mute);text-align:center;font-size:15px;margin-top:10px}
.big2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:96px;border-radius:18px;font:700 21px BarlowC,Barlow;background:var(--card2)}
.btn .ic{font-size:34px;line-height:1}
.btn.cam{background:var(--flame)}
.btn.wide{width:100%;min-height:76px;flex-direction:row;gap:12px;margin:0 0 12px}
.btn.green{background:var(--green);color:#06210f}
.btn:disabled{opacity:.5}
/* sheets */
.sheet{position:fixed;inset:0;background:var(--bg);z-index:20;overflow-y:auto;padding:calc(var(--st) + 10px) 14px calc(var(--sb) + 30px)}
.doc{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border-radius:18px;padding:18px;margin:0 0 12px;font:600 21px Barlow}
.doc .ic{font-size:32px}.doc small{display:block;color:var(--mute);font-size:15px;font-weight:500}
label.f{display:block;color:var(--mute);margin:14px 0 6px;font-size:17px}
.in{width:100%;padding:16px;border-radius:14px;background:var(--card);border:0;outline:0;font-size:20px}
textarea.in{min-height:90px}
.viewer{position:fixed;inset:0;background:#000;z-index:30;display:flex;flex-direction:column}
.viewer .vbar{display:flex;align-items:center;gap:10px;padding:calc(var(--st) + 8px) 12px 8px}
.viewer .vc{flex:1;text-align:center;font-weight:600;font-size:18px}
.vx{width:54px;height:54px;border-radius:16px;background:#222;font-size:22px}
.vdel{display:flex;align-items:center;gap:6px;height:54px;padding:0 14px;border-radius:16px;background:#2a1314;color:#ff8f93;font-weight:600;font-size:17px}
.viewer .im{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:pan-y}
.viewer .im img{max-width:100%;max-height:100%;object-fit:contain;user-select:none;-webkit-user-select:none}
.viewer .im.z{display:block;overflow:auto;touch-action:pan-x pan-y}
.viewer .im.z img{max-width:none;max-height:none;width:250%}
.vname{color:#9aa;font-size:14px;text-align:center;padding:6px 12px 0}
.viewer .nav{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px 12px calc(var(--sb) + 12px)}
.viewer .nav button{min-height:64px;border-radius:16px;background:#222;font:700 24px BarlowC,Barlow}
.confirm{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:35;display:flex;align-items:flex-end;justify-content:center;padding:14px 14px calc(var(--sb) + 14px)}
.cbox{background:var(--card);border-radius:24px;padding:20px;width:100%;max-width:460px;text-align:center}
.cstep{color:var(--mute);font-size:14px;font-weight:600;text-transform:uppercase;letter-spacing:.6px}
.cbox img{width:120px;height:120px;object-fit:cover;border-radius:14px;margin:12px auto 0;display:block}
.cbox h3{font:700 26px BarlowC,Barlow;margin:12px 0 6px}.cbox p{color:var(--ink2,#c9d4e2);margin:0 0 18px;font-size:17px}
.cbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cbtns button{height:62px;border-radius:16px;font:700 19px BarlowC,Barlow}
.cn{background:var(--card2);color:var(--ink)}.cy{background:#3a1a1c;color:#ff8f93;border:2px solid #6b2a2e}.cy.red{background:var(--red);color:#fff;border-color:var(--red)}
.cbtns button:disabled{opacity:.45}
.toast{position:fixed;left:14px;right:14px;bottom:calc(var(--sb) + 16px);background:#0b1320;border:2px solid var(--line);border-radius:16px;padding:16px;font-weight:600;z-index:40;text-align:center}
.pin{max-width:360px;margin:12vh auto 0;text-align:center}
.pin img{width:96px;border-radius:22px}
.pin .in{text-align:center;font-size:34px;letter-spacing:10px;margin:20px 0 14px}
.err{color:#ff9a9d;margin:10px 0}
.small{color:var(--mute);font-size:15px;text-align:center;margin-top:18px}
</style>
</head>
<body>
<div id="app"></div>
<input id="camIn" type="file" accept="image/*" capture="environment" hidden>
<input id="libIn" type="file" accept="image/*" multiple hidden>
<script src="app.js"></script>
</body>
</html>
